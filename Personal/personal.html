<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif ;
            text-align: center;
            margin-top: 50px;
            transition: background 0.5s, color 0.5s;

        }
        .card{
            width: 300px;
            margin:auto;
            padding:20px;
            color:azure;
            border-radius: 15px;
            box-shadow: 0 8px 16px grey;
            background: linear-gradient(to right,#0F3443,   #34E89E);
        }
        .profile-pic{
            width:100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .toggle-button{
            margin-top:20px ;
            padding:10px 20px;
            border:none ;
            border-radius: 8px;
            font-size: 14px;
            transition: background 0.3s;
            cursor: pointer;
            color:white;
            background-color: grey;
        }

        .light-theme .card{
            background: linear-gradient(to right,#FFD3A5, #FD6585);
            color:black;
        }
        .light-theme .toggle-button{
            background-color: white;
            color:black;
        }

    </style>
    
</head>
<body>
    <div class="card" id="card">
        <img class="profile-pic" src="https://i.pravatar.cc/100" alt="sarthak pic">
        <h2>Sarthak Thapa</h2>
        <p>Web Developer</P>
        <p>I love football</p>
        <button class="toggle-button" onclick="toggleTheme()">toggle theme</button>
    </div>
    <script>
        function toggleTheme(){
            document.documentElement.classList.toggle(
                'light-theme'
            )
        }
    </script>
</body>
</html>
